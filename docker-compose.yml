services:
  wealth-dashboard:
    # Builds from this checkout. To run the published image instead,
    # replace this line with:
    #   image: ghcr.io/halvar20000/wealth-dashboard:latest
    build: .
    container_name: wealth-dashboard
    restart: unless-stopped
    ports:
      # Bound to localhost. Change to "8000:8000" to reach it from your
      # LAN — and set a strong password first.
      - "127.0.0.1:8000:8000"
    volumes:
      - ./data:/data
      # Credentials on their own mount, so backing up ./data does not
      # copy your bank key with it.
      - ./secrets:/secrets
    environment:
      WD_DATA_DIR: /data
      WD_SECRETS_DIR: /secrets
      # The app runs as this user, not root, and ./data and ./secrets
      # are given to it on start. Set it to your own uid/gid (`id -u`,
      # `id -g`) so the files stay yours on the host.
      PUID: 1000
      PGID: 1000
      # Which day it is, and therefore where a month ends on the cash
      # flow and budget pages.
      TZ: Europe/Berlin
      WD_BASE_CURRENCY: EUR
      # Must match a redirect URL registered in the Enable Banking
      # Control Panel, exactly.
      WD_REDIRECT_URL: http://localhost:8000/connect/callback
