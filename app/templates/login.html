{% extends "base.html" %}
{% block title %}{{ _("Sign in") }} · Wealth Dashboard{% endblock %}
{% block heading %}{{ _("Sign in") }}{% endblock %}
{% block content %}
<form method="post" class="card form" autocomplete="off">
  {% if error %}<div class="flash flash-error">{{ error }}</div>{% endif %}
  <label for="username">{{ _("Username") }}</label>
  <input id="username" name="username" autofocus required>
  <label for="password">{{ _("Password") }}</label>
  <input id="password" name="password" type="password" autocomplete="current-password" required>
  <button type="submit">{{ _("Sign in") }}</button>
</form>
{% endblock %}
