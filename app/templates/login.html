{% extends "base.html" %}
{% block title %}Sign in · Wealth Dashboard{% endblock %}
{% block heading %}Sign in{% endblock %}
{% block content %}
<form method="post" class="card form" autocomplete="off">
  {% if error %}<div class="flash flash-error">{{ error }}</div>{% endif %}
  <label for="username">Username</label>
  <input id="username" name="username" autofocus required>
  <label for="password">Password</label>
  <input id="password" name="password" type="password" autocomplete="current-password" required>
  <button type="submit">Sign in</button>
</form>
{% endblock %}
