name: Feature request (maintainer use)
description: Used to track ideas that graduated from Discussions. Please propose new ideas in Discussions → Ideas first.
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: input
    id: discussion
    attributes:
      label: Discussion link
      description: The Ideas thread this comes from.
      placeholder: https://github.com/halvar20000/wealth-dashboard/discussions/…
  - type: textarea
    id: scope
    attributes:
      label: What gets built
      description: The agreed scope, in a few lines.
    validations:
      required: true
